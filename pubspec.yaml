name: wallpaper_selector_desktop
description: A desktop wallpaper selector application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  cached_network_image: ^3.3.0
  flutter_staggered_grid_view: ^0.7.0
  uuid: ^4.2.1
  window_manager: ^0.3.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/images/wallpapers/
    - assets/images/categories/
  
